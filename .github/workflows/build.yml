name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore CodexUsageTracker.sln
      - run: dotnet build CodexUsageTracker.sln -c Release --no-restore
      - run: dotnet test CodexUsageTracker.sln -c Release --no-build --logger trx
      - run: dotnet publish src/CodexUsageTracker.App -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CodexUsageTracker-win-x64
          path: artifacts/win-x64
